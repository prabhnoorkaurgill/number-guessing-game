<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color:pink;
            min-height:100vh;
            margin:0;
            font-family: Arial, Helvetica, sans-serif;

        }
        h1{
            margin-top:50px;
            text-align: center;
        }
        
        body > div{
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background-color: aliceblue;
    text-align: center;
    padding: 30px;
    border-radius: 20px;
    width: 400px;
    min-height: 200px;

    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}
        #guessInput{
            border-radius: 2px solid black;
            border-radius: 100px;
            padding: 10px;
            display:inline-block;
        }
        button{
            border-radius: 2px solid black;
            border-radius:100px;
            background-color:pink;
            padding: 10px 20px;
            cursor: pointer;
            display:inline-block;
        }
        p{
            font-family: Arial, Helvetica, sans-serif;
        }
        
    </style>
    <script src="numberguess.js"defer></script>
</head>
<body>
    <h1>
        Number Guessing Game
    </h1>
    <div>
    <p>
        Guess A Number Between 1 and 100 !
    </p>
    <input id="guessInput" type="number" placeholder="enter your guess">
    <button id="guessButton">
        Guess
    </button>
    <p id="message"> Good Luck!
       </p>
       <p id="attempts">Attempts: 0</p>
    </div>
</body>
</html>
